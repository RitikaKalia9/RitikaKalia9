<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Ritika Kalia — AI/ML Engineer">
  <defs>
    <radialGradient id="h-bg" cx="0.5" cy="0.5" r="1">
      <stop offset="0" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#06040d"/>
    </radialGradient>
    <radialGradient id="h-neb1" cx="0.88" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-neb2" cx="0.04" cy="1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="h-hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="h-planet" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#3a2272"/>
      <stop offset="0.6" stop-color="#1a1038"/>
      <stop offset="1" stop-color="#0f0a1f"/>
    </radialGradient>
    <radialGradient id="h-atmo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="h-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a78bfa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="h-clip"><rect width="900" height="280" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#h-clip)">
    <rect width="900" height="280" fill="url(#h-bg)"/>
    <rect width="900" height="280" fill="url(#h-grid)"/>

    <!-- Starfield -->
    <g fill="#ffffff">
      <circle cx="60" cy="34" r="1.3" opacity="0.9"/>
      <circle cx="150" cy="88" r="0.9" opacity="0.55"/>
      <circle cx="220" cy="38" r="1.1" opacity="0.75"/>
      <circle cx="300" cy="112" r="0.8" opacity="0.45"/>
      <circle cx="360" cy="52" r="1.4" opacity="0.95"/>
      <circle cx="430" cy="140" r="0.9" opacity="0.5"/>
      <circle cx="500" cy="30" r="1.1" opacity="0.7"/>
      <circle cx="560" cy="96" r="0.8" opacity="0.4"/>
      <circle cx="620" cy="46" r="1.2" opacity="0.8"/>
      <circle cx="680" cy="150" r="0.9" opacity="0.5"/>
      <circle cx="740" cy="70" r="1" opacity="0.65"/>
      <circle cx="820" cy="120" r="1.3" opacity="0.85"/>
      <circle cx="860" cy="40" r="0.9" opacity="0.55"/>
      <circle cx="120" cy="200" r="0.8" opacity="0.4"/>
      <circle cx="200" cy="240" r="1.1" opacity="0.7"/>
      <circle cx="330" cy="230" r="0.9" opacity="0.5"/>
      <circle cx="470" cy="250" r="1.2" opacity="0.75"/>
      <circle cx="560" cy="210" r="0.8" opacity="0.45"/>
      <circle cx="700" cy="240" r="1" opacity="0.6"/>
      <circle cx="820" cy="220" r="1.3" opacity="0.85"/>
    </g>
    <g fill="#a78bfa">
      <circle cx="180" cy="60" r="1.4" opacity="0.75"/>
      <circle cx="400" cy="80" r="1.2" opacity="0.6"/>
      <circle cx="640" cy="30" r="1.5" opacity="0.8"/>
      <circle cx="780" cy="200" r="1.2" opacity="0.55"/>
    </g>
    <g fill="#22d3ee">
      <circle cx="90" cy="120" r="1.4" opacity="0.7"/>
      <circle cx="320" cy="180" r="1" opacity="0.5"/>
      <circle cx="520" cy="180" r="1.3" opacity="0.65"/>
      <circle cx="880" cy="180" r="1.1" opacity="0.55"/>
    </g>

    <!-- Nebula glows -->
    <rect width="900" height="280" fill="url(#h-neb1)"/>
    <rect width="900" height="280" fill="url(#h-neb2)"/>

    <!-- Prompt line -->
    <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" fill="#22d3ee">~$</text>
    <text x="76" y="56" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" fill="#8b82a8">whoami</text>

    <!-- Name -->
    <text x="48" y="132" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="58" fill="url(#h-name)" letter-spacing="-1.5">Ritika Kalia</text>

    <!-- Subtitle -->
    <text x="48" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#e9e6f5">AI/ML Engineer  ·  Researcher  ·  Full-Stack Developer</text>

    <!-- Tagline -->
    <text x="48" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b82a8">Building intelligent solutions for a smarter tomorrow.</text>

    <!-- Badges -->
    <g transform="translate(48, 228)">
      <rect width="238" height="28" rx="14" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35"/>
      <circle cx="16" cy="14" r="3" fill="#22d3ee"/>
      <circle cx="16" cy="14" r="6" fill="#22d3ee" fill-opacity="0.25"/>
      <text x="30" y="19" font-family="ui-monospace, monospace" font-size="12" fill="#a78bfa">Open to AI/ML &amp; Full-Stack</text>
    </g>
    <g transform="translate(298, 228)">
      <rect width="170" height="28" rx="14" fill="#22d3ee" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.3"/>
      <text x="16" y="19" font-family="ui-monospace, monospace" font-size="12" fill="#22d3ee">Chandigarh, India</text>
    </g>

    <!-- Planet with rings -->
    <g transform="translate(740, 130)">
      <circle r="90" fill="none" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4 8"/>
      <circle r="76" fill="none" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="1"/>
      <ellipse rx="120" ry="26" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.2" transform="rotate(-18)"/>
      <ellipse rx="120" ry="26" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="1" transform="rotate(-18)" stroke-dasharray="3 6"/>
      <circle r="52" fill="url(#h-planet)"/>
      <circle r="52" fill="url(#h-atmo)"/>
      <path d="M -40 -18 Q 0 -34 40 -18 Q 30 6 0 18 Q -30 6 -40 -18 Z" fill="#a78bfa" fill-opacity="0.22"/>
      <ellipse cx="-18" cy="-10" rx="8" ry="4" fill="#c4b5fd" fill-opacity="0.35"/>
      <circle cx="90" cy="0" r="3.5" fill="#22d3ee"/>
      <circle cx="90" cy="0" r="7" fill="#22d3ee" fill-opacity="0.25"/>
    </g>

    <!-- Border -->
    <rect x="0.5" y="0.5" width="899" height="279" rx="22" fill="none" stroke="url(#h-hair)" stroke-width="1" stroke-opacity="0.6"/>
  </g>
</svg>
