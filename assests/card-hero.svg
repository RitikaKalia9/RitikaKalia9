<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Ritika Kalia — AI/ML Engineer">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a1f"/>
      <stop offset="1" stop-color="#06040d"/>
    </linearGradient>
    <linearGradient id="hero-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="hero-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="hero-glow-tr" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-bl" cx="0.05" cy="1" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a78bfa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="hero-clip"><rect width="900" height="280" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="900" height="280" fill="url(#hero-bg)"/>
    <rect width="900" height="280" fill="url(#hero-grid)"/>
    <rect width="900" height="280" fill="url(#hero-glow-tr)"/>
    <rect width="900" height="280" fill="url(#hero-glow-bl)"/>

    <text x="48" y="56" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" fill="#22d3ee">~$</text>
    <text x="76" y="56" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" fill="#8b82a8">whoami</text>

    <text x="48" y="130" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="58" fill="url(#hero-name)" letter-spacing="-1.5">Ritika Kalia</text>

    <text x="48" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#e9e6f5">AI/ML Engineer  ·  Researcher  ·  Full-Stack Developer</text>

    <text x="48" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#8b82a8">Building intelligent solutions for a smarter tomorrow.</text>

    <g transform="translate(48, 226)">
      <rect width="230" height="28" rx="14" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.35"/>
      <circle cx="16" cy="14" r="3" fill="#22d3ee"/>
      <text x="30" y="19" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="12" fill="#a78bfa">Open to AI/ML &amp; Full-Stack</text>
    </g>
    <g transform="translate(290, 226)">
      <rect width="170" height="28" rx="14" fill="#22d3ee" fill-opacity="0.06" stroke="#22d3ee" stroke-opacity="0.3"/>
      <text x="16" y="19" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="12" fill="#22d3ee">Chandigarh, India</text>
    </g>

    <g transform="translate(730, 140)">
      <circle r="82" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 6"/>
      <circle r="64" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="1"/>
      <circle r="50" fill="#0f0a1f" fill-opacity="0.85" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
      <circle r="50" fill="#a78bfa" fill-opacity="0.06"/>
      <text x="0" y="10" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600" font-size="34" fill="#a78bfa">RK</text>
      <circle cx="82" cy="0" r="4" fill="#a78bfa"/>
      <circle cx="-82" cy="0" r="4" fill="#22d3ee"/>
    </g>

    <rect x="0.5" y="0.5" width="899" height="279" rx="22" fill="none" stroke="url(#hero-border)" stroke-width="1"/>
  </g>
</svg>
