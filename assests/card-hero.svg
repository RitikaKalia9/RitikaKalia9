<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ritika Kalia — AI/ML Engineer">
  <defs>
    <!-- ============================================================
         Real FBM-like noise for the nebula (matches WebGL skybox)
         ============================================================ -->
    <filter id="rk-neb-purple" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.006" numOctaves="4" seed="3" stitchTiles="stitch" result="noise"/>
      <!-- Warp the noise into purple-blue palette, alpha from noise itself -->
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.485
        0 0 0 0 0.227
        0 0 0 0 0.929
        0.85 0 0 0 -0.35
      "/>
    </filter>

    <filter id="rk-neb-teal" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.007" numOctaves="4" seed="13" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.133
        0 0 0 0 0.827
        0 0 0 0 0.933
        0.75 0 0 0 -0.30
      "/>
    </filter>

    <filter id="rk-neb-magenta" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.008" numOctaves="3" seed="42" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0 0 0 0 0.514
        0 0 0 0 0.094
        0 0 0 0 0.263
        0.7 0 0 0 -0.35
      "/>
    </filter>

    <!-- Soft blur for nebula softness -->
    <filter id="rk-soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- ============================================================
         Region masks — where each nebula lives
         ============================================================ -->
    <radialGradient id="rk-mask-purple" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.5" stop-color="#999"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>

    <radialGradient id="rk-mask-teal" cx="0.12" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.5" stop-color="#888"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>

    <radialGradient id="rk-mask-magenta" cx="0.75" cy="0.95" r="0.4">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>

    <mask id="rk-region-purple">
      <rect width="1200" height="300" fill="url(#rk-mask-purple)"/>
    </mask>
    <mask id="rk-region-teal">
      <rect width="1200" height="300" fill="url(#rk-mask-teal)"/>
    </mask>
    <mask id="rk-region-magenta">
      <rect width="1200" height="300" fill="url(#rk-mask-magenta)"/>
    </mask>

    <!-- ============================================================
         Vignette (exact copy of portfolio .vignette)
         ============================================================ -->
    <radialGradient id="rk-vig" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.35" stop-color="#04020a" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#04020a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#04020a" stop-opacity="0.85"/>
    </radialGradient>

    <!-- ============================================================
         Text gradients
         ============================================================ -->
    <linearGradient id="rk-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa">
        <animate attributeName="offset" values="0.4;0.6;0.4" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="rk-hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="rk-border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="rk-starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="1.1"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="rk-cardClip"><rect width="1200" height="300" rx="22"/></clipPath>

    <clipPath id="rk-typeClip">
      <rect x="0" y="0" width="0" height="26">
        <animate attributeName="width" values="0;450;450;0;0" keyTimes="0;0.55;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <linearGradient id="rk-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e6f5" stop-opacity="0"/>
      <stop offset="1" stop-color="#e9e6f5" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#rk-cardClip)">

    <!-- ============================================================
         1. BASE — exact WebGL clear color
         ============================================================ -->
    <rect width="1200" height="300" fill="#04020a"/>

    <!-- ============================================================
         2. NEBULA — real fractal noise, masked by region
         ============================================================ -->
    <g mask="url(#rk-region-purple)" opacity="0.85" style="mix-blend-mode:screen">
      <rect width="1200" height="300" filter="url(#rk-neb-purple)" opacity="0.55"/>
    </g>

    <g mask="url(#rk-region-teal)" opacity="0.7" style="mix-blend-mode:screen">
      <rect width="1200" height="300" filter="url(#rk-neb-teal)" opacity="0.4"/>
    </g>

    <g mask="url(#rk-region-magenta)" opacity="0.4" style="mix-blend-mode:screen">
      <rect width="1200" height="300" filter="url(#rk-neb-magenta)" opacity="0.35"/>
    </g>

    <!-- ============================================================
         3. STARFIELD — small, sparse, blackbody-tinted
         ============================================================ -->
    <!-- Warm/white stars -->
    <g fill="#ffffff">
      <circle cx="82" cy="46" r="0.9" opacity="0.75"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="168" cy="112" r="0.7" opacity="0.55"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="254" cy="52" r="1" opacity="0.7"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="3.6s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="342" cy="138" r="0.6" opacity="0.45"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="428" cy="38" r="0.8" opacity="0.6"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="2.9s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="512" cy="92" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="592" cy="34" r="0.9" opacity="0.7"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="678" cy="124" r="0.6" opacity="0.4"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.5s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="752" cy="46" r="0.8" opacity="0.6"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="858" cy="96" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.3s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="962" cy="40" r="0.9" opacity="0.7"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="1088" cy="118" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.6s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="1148" cy="58" r="0.8" opacity="0.55"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>

      <circle cx="118" cy="222" r="0.7" opacity="0.45"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.2s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="228" cy="268" r="0.8" opacity="0.55"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.4s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="368" cy="238" r="0.6" opacity="0.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="488" cy="282" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="628" cy="262" r="0.9" opacity="0.6"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.5s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="748" cy="238" r="0.6" opacity="0.4"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="878" cy="278" r="0.8" opacity="0.5"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.3s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="1008" cy="244" r="0.7" opacity="0.45"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.1s" begin="1.7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Pale lavender stars (cooler, matching blackbody upper range) -->
    <g fill="#c4b5fd">
      <circle cx="308" cy="88" r="0.85" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="548" cy="182" r="0.75" opacity="0.45"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="908" cy="188" r="0.85" opacity="0.45"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.5s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="698" cy="82" r="0.7" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.3s" begin="2.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Pale cyan stars (cooler still) -->
    <g fill="#a5f3fc">
      <circle cx="188" cy="162" r="0.8" opacity="0.45"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="812" cy="202" r="0.7" opacity="0.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.3s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="1058" cy="142" r="0.75" opacity="0.4"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- ============================================================
         4. Distant planet (dim, on right edge — like portfolio's teal planet)
         ============================================================ -->
    <g transform="translate(1098, 168)" opacity="0.55">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
        <circle r="40" fill="none" stroke="#a78bfa" stroke-opacity="0.1" stroke-width="0.7" stroke-dasharray="3 8"/>
      </g>
      <circle r="26" fill="#0b0716"/>
      <circle r="26" fill="none" stroke="#22d3ee" stroke-opacity="0.18" stroke-width="0.7"/>
      <!-- Very faint atmospheric rim -->
      <circle r="26" fill="none" stroke="#22d3ee" stroke-opacity="0.1" stroke-width="3"/>
      <!-- Subtle surface patches -->
      <ellipse cx="-8" cy="-5" rx="6" ry="3" fill="#22d3ee" fill-opacity="0.15"/>
      <ellipse cx="9" cy="6" rx="4" ry="2" fill="#a78bfa" fill-opacity="0.12"/>
      <!-- Tiny orbiting moon -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
        <circle cx="40" cy="0" r="1.5" fill="#22d3ee" opacity="0.65"/>
      </g>
    </g>

    <!-- ============================================================
         5. Single slow meteor
         ============================================================ -->
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="980,-10;420,220;420,220" keyTimes="0;0.24;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0;0" keyTimes="0;0.04;0.20;0.28;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="52" y2="-30" stroke="url(#rk-trail)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1.6" fill="#e9e6f5" filter="url(#rk-starGlow)"/>
    </g>

    <!-- ============================================================
         6. VIGNETTE — exact portfolio match
         ============================================================ -->
    <rect width="1200" height="300" fill="url(#rk-vig)"/>

    <!-- ============================================================
         7. CONTENT — name, subtitle, terminal
         ============================================================ -->

    <!-- Name -->
    <text x="600" y="146" text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600"
      font-size="72" fill="url(#rk-name)" letter-spacing="-1.5">Ritika Kalia</text>

    <!-- Subtitle -->
    <text x="600" y="180" text-anchor="middle"
      font-family="ui-monospace, 'SF Mono', Consolas, monospace"
      font-size="12" fill="#8b82a8" letter-spacing="3">CS UNDERGRAD · AI/ML &amp; FULL-STACK DEVELOPER</text>

    <!-- Terminal bar -->
    <g transform="translate(340, 206)">
      <rect width="520" height="40" rx="10" fill="#05030c" fill-opacity="0.9" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="1"/>
      <rect x="0" y="0" width="520" height="1" fill="url(#rk-hair)"/>
      <text x="16" y="26" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14" fill="#22d3ee">&gt;_</text>
      <g clip-path="url(#rk-typeClip)" transform="translate(42,0)">
        <text x="0" y="26" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" fill="#e9e6f5">Building <tspan fill="#a78bfa">intelligent</tspan> solutions for a <tspan fill="#22d3ee">smarter</tspan> tomorrow.</text>
      </g>
      <rect x="42" y="12" width="2" height="16" fill="#22d3ee">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="x" values="42;42;470;470;42;42" keyTimes="0;0.001;0.55;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Border -->
    <rect x="0.5" y="0.5" width="1199" height="299" rx="22" fill="none" stroke="url(#rk-border)" stroke-width="1"/>
  </g>
</svg>
