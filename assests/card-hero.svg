<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ritika Kalia — AI/ML Engineer">
  <defs>
    <radialGradient id="rk-bg" cx="0.5" cy="0.5" r="1">
      <stop offset="0" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#06040d"/>
    </radialGradient>

    <radialGradient id="rk-neb1" cx="0.88" cy="0.05" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rk-neb2" cx="0.04" cy="1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rk-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa">
        <animate attributeName="offset" values="0.35;0.65;0.35" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="rk-border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="rk-hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>

    <radialGradient id="rk-planet" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#3a2272"/>
      <stop offset="0.6" stop-color="#1a1038"/>
      <stop offset="1" stop-color="#0f0a1f"/>
    </radialGradient>

    <radialGradient id="rk-atmo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.6"/>
    </radialGradient>

    <radialGradient id="rk-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#06040d" stop-opacity="0"/>
      <stop offset="1" stop-color="#06040d" stop-opacity="0.7"/>
    </radialGradient>

    <filter id="rk-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5">
        <animate attributeName="stdDeviation" values="3.5;8;3.5" dur="3.2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="rk-starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="rk-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a78bfa" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="rk-typeClip">
      <rect x="0" y="0" width="0" height="30">
        <animate attributeName="width" values="0;470;470;0;0" keyTimes="0;0.55;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="rk-cardClip"><rect width="1200" height="300" rx="22"/></clipPath>

    <linearGradient id="rk-trail0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="rk-trail1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="rk-trail2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#rk-cardClip)">
    <!-- Background -->
    <rect width="1200" height="300" fill="url(#rk-bg)"/>
    <rect width="1200" height="300" fill="url(#rk-grid)"/>

    <!-- Twinkling starfield -->
    <g fill="#ffffff">
      <circle cx="70" cy="34" r="1.3" opacity="0.9"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.1s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="82" r="0.9" opacity="0.55"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="215" cy="42" r="1.2" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="112" r="0.8" opacity="0.45"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="355" cy="52" r="1.4" opacity="0.95"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="140" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.8s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="500" cy="28" r="1.1" opacity="0.7"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="96" r="0.8" opacity="0.4"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.2s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="46" r="1.2" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="150" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="120" r="1.3" opacity="0.85"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.1s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="118" cy="220" r="0.8" opacity="0.4"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.5s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="205" cy="258" r="1.1" opacity="0.7"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.7s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="268" r="1.2" opacity="0.75"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="248" r="1.3" opacity="0.85"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="60" r="1" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.3s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="220" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#a78bfa">
      <circle cx="180" cy="60" r="1.4" opacity="0.75"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="80" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="30" r="1.5" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="890" cy="240" r="1.2" opacity="0.6"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#22d3ee">
      <circle cx="90" cy="120" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="180" r="1.3" opacity="0.65"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="180" r="1.1" opacity="0.55"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.6s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="270" r="1.1" opacity="0.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Nebula glows -->
    <rect width="1200" height="300" fill="url(#rk-neb1)"/>
    <rect width="1200" height="300" fill="url(#rk-neb2)"/>

    <!-- Planet with rings + orbiting moons (right side) -->
    <g transform="translate(1055, 150)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <circle r="82" fill="none" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="4 8"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
        <circle r="68" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1"/>
      </g>
      <ellipse rx="108" ry="22" fill="none" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.2" transform="rotate(-18)"/>
      <ellipse rx="108" ry="22" fill="none" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3 6" transform="rotate(-18)"/>
      <circle r="46" fill="url(#rk-planet)"/>
      <circle r="46" fill="url(#rk-atmo)"/>
      <path d="M -36 -16 Q 0 -30 36 -16 Q 26 6 0 16 Q -26 6 -36 -16 Z" fill="#a78bfa" fill-opacity="0.24"/>
      <ellipse cx="-16" cy="-8" rx="7" ry="3.5" fill="#c4b5fd" fill-opacity="0.35"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        <circle cx="82" cy="0" r="6" fill="#22d3ee" fill-opacity="0.25"/>
        <circle cx="82" cy="0" r="3" fill="#22d3ee"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
        <circle cx="108" cy="0" r="5" fill="#a78bfa" fill-opacity="0.25"/>
        <circle cx="108" cy="0" r="2.5" fill="#a78bfa"/>
      </g>
    </g>

    <!-- Meteors -->
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="950,-10;470,250;470,250" keyTimes="0;0.24;1" dur="5.5s" begin="0.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.28;1" dur="5.5s" begin="0.0s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="62" y2="-36" stroke="url(#rk-trail0)" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.6" fill="#e9e6f5" filter="url(#rk-starGlow)"/>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="300,-15;720,225;720,225" keyTimes="0;0.24;1" dur="6.5s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.28;1" dur="6.5s" begin="2.2s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="-58" y2="-34" stroke="url(#rk-trail1)" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#e0f7ff" filter="url(#rk-starGlow)"/>
    </g>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="1080,40;560,270;560,270" keyTimes="0;0.24;1" dur="7s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.20;0.28;1" dur="7s" begin="4s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="66" y2="-32" stroke="url(#rk-trail2)" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.4" fill="#ffffff" filter="url(#rk-starGlow)"/>
    </g>

    <!-- Name: Cormorant italic with purple→cyan gradient (matches hero h1 .name) -->
    <text x="600" y="148" text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600"
      font-size="76" fill="url(#rk-name)" letter-spacing="-1.5">Ritika Kalia</text>

    <!-- Subtitle -->
    <text x="600" y="184" text-anchor="middle"
      font-family="ui-monospace, 'SF Mono', Consolas, monospace"
      font-size="13" fill="#8b82a8" letter-spacing="2">CS UNDERGRAD · AI/ML &amp; FULL-STACK DEVELOPER</text>

    <!-- Terminal bar -->
    <g transform="translate(320, 212)">
      <rect width="560" height="42" rx="10" fill="#0f0a1f" fill-opacity="0.85" stroke="#a78bfa" stroke-opacity="0.3"/>
      <rect x="0" y="0" width="560" height="1" fill="url(#rk-hair)"/>
      <text x="18" y="27" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="15" fill="#22d3ee">&gt;_</text>
      <g clip-path="url(#rk-typeClip)" transform="translate(46,0)">
        <text x="0" y="27" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14" fill="#e9e6f5">Building <tspan fill="#a78bfa">intelligent</tspan> solutions for a <tspan fill="#22d3ee">smarter</tspan> tomorrow.</text>
      </g>
      <rect x="46" y="12" width="2.5" height="18" fill="#22d3ee">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="x" values="46;46;510;510;46;46" keyTimes="0;0.001;0.55;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Vignette -->
    <ellipse cx="600" cy="150" rx="620" ry="180" fill="url(#rk-vig)"/>

    <!-- Animated border -->
    <rect x="0.5" y="0.5" width="1199" height="299" rx="22" fill="none" stroke="url(#rk-border)" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0.5" y="0.5" width="1199" height="299" rx="22" fill="none" stroke="#a78bfa" stroke-width="6" opacity="0.08" filter="url(#rk-glow)">
      <animate attributeName="opacity" values="0.04;0.16;0.04" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
