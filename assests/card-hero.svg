<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="bTitle bDesc">
  <title id="bTitle">Ritika Kalia — AI/ML Engineer</title>
  <desc id="bDesc">Animated space banner: Ritika Kalia, AI/ML Engineer, building intelligent solutions for a smarter tomorrow.</desc>

  <defs>
    <!-- ===== Background ===== -->
    <linearGradient id="sky" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0b0718"/>
      <stop offset="0.45" stop-color="#06040f"/>
      <stop offset="1" stop-color="#04020a"/>
    </linearGradient>

    <radialGradient id="nebPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#5b21b6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3b0f6b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="0.5" stop-color="#0e7490" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebMagenta" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#831843" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#831843" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.35" stop-color="#04020a" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#04020a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#04020a" stop-opacity="0.92"/>
    </radialGradient>

    <!-- ===== Text & accents ===== -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c4b5fd"/>
      <stop offset="0.75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e9e6f5" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- ===== Planet ===== -->
    <radialGradient id="planetBody" cx="0.34" cy="0.30" r="0.82">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.22" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="0.82" stop-color="#2b1055"/>
      <stop offset="1" stop-color="#0a0616"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="0.25" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="0.75" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="meteorGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-84" y2="50">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <!-- ===== Filters ===== -->
    <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="textGlow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="400" rx="26"/>
    </clipPath>
  </defs>

  <style>
    /* ---------- shared ---------- */
    .tw  { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.6s ease-in-out infinite; }
    .tw3 { animation: twinkle 2.4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .16 } 50% { opacity: 1 } }

    .d1 { animation: drift1 22s ease-in-out infinite; }
    .d2 { animation: drift2 27s ease-in-out infinite; }
    .d3 { animation: drift3 31s ease-in-out infinite; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0) }      50% { transform: translate(34px,-20px) } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) }      50% { transform: translate(-40px,22px) } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0) }      50% { transform: translate(24px,16px) } }

    .spk { animation: sparkle 4s ease-in-out infinite; }
    @keyframes sparkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }

    /* ---------- meteors ---------- */
    .meteor { animation: shoot 9s cubic-bezier(.4,0,.7,1) infinite; opacity: 0; }
    @keyframes shoot {
      0%   { transform: translate(0,0);          opacity: 0; }
      6%   { opacity: 1; }
      46%  { opacity: 1; }
      62%  { transform: translate(-620px, 372px); opacity: 0; }
      100% { transform: translate(-620px, 372px); opacity: 0; }
    }

    /* ---------- shine sweep ---------- */
    .sweep { animation: sweep 9s ease-in-out infinite; opacity: .07; }
    @keyframes sweep { 0% { transform: translateX(0) } 55%, 100% { transform: translateX(1750px) } }

    /* ---------- entrance ---------- */
    .rise { animation: rise .95s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: translateY(0) } }

    .pulseDot { animation: pulseDot 2.2s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100% { opacity: 1 } 50% { opacity: .28 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .meteor { opacity: 0; }
      .rise  { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">

    <!-- ================= BACKGROUND ================= -->
    <rect width="1200" height="400" fill="url(#sky)"/>

    <!-- ================= NEBULAE ================= -->
    <g>
      <ellipse class="d1" cx="240"  cy="110" rx="430" ry="290" fill="url(#nebPurple)"/>
      <ellipse class="d2" cx="1060" cy="330" rx="380" ry="250" fill="url(#nebCyan)"/>
      <ellipse class="d3" cx="700"  cy="40"  rx="320" ry="180" fill="url(#nebMagenta)"/>
    </g>

    <!-- ================= STARFIELD ================= -->
    <g fill="#e9e6f5">
      <circle class="tw"  cx="46"   cy="38"  r="1.0"  style="animation-delay:-.4s"/>
      <circle class="tw2" cx="112"  cy="22"  r="0.8"  style="animation-delay:-1.1s"/>
      <circle class="tw3" cx="168"  cy="74"  r="1.3"  style="animation-delay:-.7s"/>
      <circle class="tw"  cx="222"  cy="30"  r="0.7"  style="animation-delay:-2.0s"/>
      <circle class="tw2" cx="268"  cy="110" r="1.1"  style="animation-delay:-.2s"/>
      <circle class="tw3" cx="312"  cy="52"  r="1.5"  style="animation-delay:-1.6s"/>
      <circle class="tw"  cx="356"  cy="140" r="0.85" style="animation-delay:-2.8s"/>
      <circle class="tw2" cx="398"  cy="24"  r="1.2"  style="animation-delay:-.9s"/>
      <circle class="tw3" cx="438"  cy="92"  r="0.75" style="animation-delay:-3.1s"/>
      <circle class="tw"  cx="486"  cy="160" r="1.25" style="animation-delay:-1.4s"/>
      <circle class="tw2" cx="528"  cy="40"  r="0.9"  style="animation-delay:-2.3s"/>
      <circle class="tw3" cx="566"  cy="124" r="1.05" style="animation-delay:-.5s"/>
      <circle class="tw"  cx="608"  cy="196" r="0.8"  style="animation-delay:-3.5s"/>
      <circle class="tw2" cx="648"  cy="66"  r="1.4"  style="animation-delay:-1.9s"/>
      <circle class="tw3" cx="690"  cy="150" r="0.9"  style="animation-delay:-2.6s"/>
      <circle class="tw"  cx="728"  cy="34"  r="1.0"  style="animation-delay:-.8s"/>
      <circle class="tw2" cx="768"  cy="116" r="0.7"  style="animation-delay:-3.3s"/>
      <circle class="tw3" cx="806"  cy="186" r="1.15" style="animation-delay:-1.2s"/>
      <circle class="tw"  cx="846"  cy="58"  r="0.85" style="animation-delay:-2.1s"/>
      <circle class="tw2" cx="884"  cy="142" r="1.3"  style="animation-delay:-.3s"/>
      <circle class="tw3" cx="922"  cy="26"  r="0.8"  style="animation-delay:-2.9s"/>
      <circle class="tw"  cx="958"  cy="178" r="1.0"  style="animation-delay:-1.7s"/>
      <circle class="tw2" cx="996"  cy="86"  r="0.7"  style="animation-delay:-3.7s"/>
      <circle class="tw3" cx="1034" cy="214" r="1.1"  style="animation-delay:-.6s"/>
      <circle class="tw"  cx="1072" cy="48"  r="1.25" style="animation-delay:-2.5s"/>
      <circle class="tw2" cx="1108" cy="138" r="0.8"  style="animation-delay:-1.3s"/>
      <circle class="tw3" cx="1146" cy="206" r="1.0"  style="animation-delay:-3.0s"/>
      <circle class="tw"  cx="1178" cy="76"  r="0.9"  style="animation-delay:-.2s"/>

      <circle class="tw2" cx="58"   cy="246" r="0.9"  style="animation-delay:-1.0s"/>
      <circle class="tw"  cx="104"  cy="312" r="1.15" style="animation-delay:-2.7s"/>
      <circle class="tw3" cx="152"  cy="268" r="0.7"  style="animation-delay:-.4s"/>
      <circle class="tw2" cx="196"  cy="352" r="1.0"  style="animation-delay:-3.2s"/>
      <circle class="tw"  cx="242"  cy="292" r="1.35" style="animation-delay:-1.5s"/>
      <circle class="tw3" cx="286"  cy="368" r="0.8"  style="animation-delay:-2.2s"/>
      <circle class="tw2" cx="330"  cy="244" r="1.1"  style="animation-delay:-.7s"/>
      <circle class="tw"  cx="374"  cy="330" r="0.7"  style="animation-delay:-3.6s"/>
      <circle class="tw3" cx="418"  cy="276" r="1.25" style="animation-delay:-1.8s"/>
      <circle class="tw2" cx="462"  cy="358" r="0.9"  style="animation-delay:-.3s"/>
      <circle class="tw"  cx="508"  cy="300" r="1.0"  style="animation-delay:-2.4s"/>
      <circle class="tw3" cx="548"  cy="252" r="0.8"  style="animation-delay:-3.4s"/>
      <circle class="tw2" cx="592"  cy="340" r="1.15" style="animation-delay:-1.1s"/>
      <circle class="tw"  cx="634"  cy="286" r="0.9"  style="animation-delay:-.6s"/>
      <circle class="tw3" cx="676"  cy="366" r="0.7"  style="animation-delay:-2.8s"/>
      <circle class="tw2" cx="718"  cy="318" r="1.1"  style="animation-delay:-1.9s"/>
      <circle class="tw"  cx="758"  cy="262" r="0.8"  style="animation-delay:-3.3s"/>
      <circle class="tw3" cx="798"  cy="348" r="1.0"  style="animation-delay:-.5s"/>
      <circle class="tw2" cx="840"  cy="292" r="0.9"  style="animation-delay:-2.6s"/>
      <circle class="tw"  cx="882"  cy="370" r="1.15" style="animation-delay:-1.4s"/>
      <circle class="tw3" cx="920"  cy="300" r="0.7"  style="animation-delay:-3.8s"/>
      <circle class="tw2" cx="962"  cy="352" r="1.0"  style="animation-delay:-.9s"/>
      <circle class="tw"  cx="1002" cy="282" r="0.9"  style="animation-delay:-2.0s"/>
      <circle class="tw3" cx="1042" cy="364" r="1.1"  style="animation-delay:-3.0s"/>
      <circle class="tw2" cx="1082" cy="304" r="0.8"  style="animation-delay:-1.6s"/>
      <circle class="tw"  cx="1122" cy="352" r="1.0"  style="animation-delay:-.2s"/>
      <circle class="tw3" cx="1164" cy="286" r="0.9"  style="animation-delay:-2.5s"/>

      <!-- coloured accents -->
      <circle class="tw2" cx="205"  cy="180" r="1.2" fill="#c4b5fd" style="animation-delay:-1.2s"/>
      <circle class="tw"  cx="742"  cy="228" r="1.1" fill="#a5f3fc" style="animation-delay:-2.9s"/>
      <circle class="tw3" cx="1104" cy="240" r="1.2" fill="#c4b5fd" style="animation-delay:-.7s"/>
    </g>

    <!-- ================= SPARKLES ================= -->
    <g fill="#e9e6f5">
      <g class="spk" transform="translate(300,58)" style="animation-delay:-1.2s">
        <path d="M0,-9 L1.4,-1.4 L9,0 L1.4,1.4 L0,9 L-1.4,1.4 L-9,0 L-1.4,-1.4 Z"/>
      </g>
      <g class="spk" transform="translate(700,342) scale(0.8)" style="animation-delay:-3.1s">
        <path d="M0,-9 L1.4,-1.4 L9,0 L1.4,1.4 L0,9 L-1.4,1.4 L-9,0 L-1.4,-1.4 Z"/>
      </g>
      <g class="spk" transform="translate(180,352) scale(0.62)" style="animation-delay:-.6s">
        <path d="M0,-9 L1.4,-1.4 L9,0 L1.4,1.4 L0,9 L-1.4,1.4 L-9,0 L-1.4,-1.4 Z"/>
      </g>
      <g class="spk" transform="translate(1120,62) scale(0.7)" fill="#a5f3fc" style="animation-delay:-2.2s">
        <path d="M0,-9 L1.4,-1.4 L9,0 L1.4,1.4 L0,9 L-1.4,1.4 L-9,0 L-1.4,-1.4 Z"/>
      </g>
    </g>

    <!-- ================= METEORS ================= -->
    <g class="meteors">
      <g transform="translate(360,-40)">
        <g class="meteor" style="animation-delay:0s">
          <line x1="0" y1="0" x2="-84" y2="50" stroke="url(#meteorGrad)" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="2.4" fill="#ffffff"/>
        </g>
      </g>
      <g transform="translate(880,-60)">
        <g class="meteor" style="animation-delay:-3.4s">
          <line x1="0" y1="0" x2="-96" y2="58" stroke="url(#meteorGrad)" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="2.8" fill="#ffffff"/>
        </g>
      </g>
      <g transform="translate(640,-90)">
        <g class="meteor" style="animation-delay:-6.2s">
          <line x1="0" y1="0" x2="-70" y2="42" stroke="url(#meteorGrad)" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="0" cy="0" r="2" fill="#ffffff"/>
        </g>
      </g>
    </g>

    <!-- ================= PLANET ================= -->
    <g class="planet">
      <!-- dashed orbit -->
      <circle cx="980" cy="195" r="140" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3 9" opacity="0.35"/>

      <!-- back half of ring -->
      <g transform="rotate(-18 980 195)">
        <ellipse cx="980" cy="195" rx="152" ry="40" fill="none"
                 stroke="url(#ringGrad)" stroke-width="9" opacity="0.30"/>
      </g>

      <!-- planet body -->
      <circle cx="980" cy="195" r="86" fill="url(#planetBody)"/>

      <!-- atmosphere -->
      <circle cx="980" cy="195" r="94" fill="none" stroke="#22d3ee" stroke-width="9" opacity="0.10" filter="url(#softBlur)"/>
      <circle cx="980" cy="195" r="88" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity="0.5"/>

      <!-- front half of ring -->
      <g transform="rotate(-18 980 195)">
        <path d="M 828,195 A 152,40 0 0 0 1132,195" fill="none"
              stroke="url(#ringGrad)" stroke-width="9" stroke-linecap="round" opacity="0.95"/>
      </g>

      <!-- orbiting moon -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 980 195" to="360 980 195"
                          dur="18s" repeatCount="indefinite"/>
        <circle cx="1120" cy="195" r="13" fill="#22d3ee" opacity="0.22" filter="url(#softBlur)"/>
        <circle cx="1120" cy="195" r="7" fill="#a5f3fc"/>
      </g>
    </g>

    <!-- ================= OVERLAYS ================= -->
    <rect width="1200" height="400" fill="url(#vignette)"/>
    <rect width="1200" height="400" filter="url(#grain)" opacity="0.06" style="mix-blend-mode:overlay"/>

    <g class="sweep">
      <g transform="skewX(-20)">
        <rect x="-200" y="-200" width="120" height="800" fill="url(#sweepGrad)"/>
      </g>
    </g>

    <!-- ================= CONTENT ================= -->
    <g class="content"
       font-family="'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">

      <!-- badge -->
      <g class="rise" style="animation-delay:.10s">
        <rect x="80" y="82" width="218" height="34" rx="17"
              fill="#a78bfa" fill-opacity="0.08"
              stroke="#a78bfa" stroke-opacity="0.30" stroke-width="1"/>
        <circle class="pulseDot" cx="103" cy="99" r="4.5" fill="#22d3ee"/>
        <text x="118" y="103.5"
              font-size="12" font-weight="500" letter-spacing="2.4"
              fill="#a78bfa"
              font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">AI / ML ENGINEER</text>
      </g>

      <!-- name -->
      <g class="rise" style="animation-delay:.25s">
        <text x="78" y="190" font-size="70" font-weight="700" letter-spacing="-1.5"
              fill="#7c3aed" opacity="0.55" filter="url(#textGlow)">Ritika Kalia</text>
        <text x="78" y="190" font-size="70" font-weight="700" letter-spacing="-1.5" fill="url(#nameGrad)">Ritika <tspan font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="600">Kalia</tspan></text>
      </g>

      <!-- tagline -->
      <g class="rise" style="animation-delay:.42s">
        <text x="80" y="232" font-size="18.5" font-weight="400" fill="#8b82a8" letter-spacing="0.2">Building intelligent solutions for a smarter tomorrow.</text>
      </g>

      <!-- chips -->
      <g class="rise" style="animation-delay:.58s"
         font-family="'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace"
         font-size="11.5" fill="#c4b5fd" text-anchor="middle">

        <rect x="80"  y="266" width="96"  height="30" rx="15" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.22"/>
        <text x="128" y="285">Indic LLMs</text>

        <rect x="186" y="266" width="58"  height="30" rx="15" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.22"/>
        <text x="215" y="285">RAG</text>

        <rect x="254" y="266" width="98"  height="30" rx="15" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.22"/>
        <text x="303" y="285">VideoMAE</text>

        <rect x="362" y="266" width="100" height="30" rx="15" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-opacity="0.22"/>
        <text x="412" y="285">XR Privacy</text>
      </g>
    </g>

  </g>

  <!-- frame -->
  <rect x="1" y="1" width="1198" height="398" rx="25"
        fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
</svg>
