<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ritika Kalia — AI/ML Engineer">
  <defs>
    <!-- Base: exact portfolio #04020a -->
    <radialGradient id="rk-base" cx="0.5" cy="0.5" r="1">
      <stop offset="0" stop-color="#06040d"/>
      <stop offset="1" stop-color="#04020a"/>
    </radialGradient>

    <!-- Nebula corner glows — VERY faint, matches skybox intensity 0.62 / 0.42 -->
    <radialGradient id="rk-neb-tr" cx="0.88" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#3b0f6b" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rk-neb-bl" cx="0.06" cy="1" r="0.5">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <!-- Very faint central lavender haze (matches portfolio's soft middle) -->
    <radialGradient id="rk-haze" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.06"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette — exact match to portfolio .vignette -->
    <radialGradient id="rk-vig" cx="0.5" cy="0.45" r="0.85">
      <stop offset="0.35" stop-color="#04020a" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#04020a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#04020a" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Name gradient — exact portfolio hero (c4b5fd → a78bfa → 22d3ee) -->
    <linearGradient id="rk-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#a78bfa">
        <animate attributeName="offset" values="0.4;0.6;0.4" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Border: portfolio .project-item border — very subtle -->
    <linearGradient id="rk-border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.22"/>
    </linearGradient>

    <filter id="rk-starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="rk-softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>

    <clipPath id="rk-cardClip"><rect width="1200" height="300" rx="22"/></clipPath>

    <clipPath id="rk-typeClip">
      <rect x="0" y="0" width="0" height="26">
        <animate attributeName="width" values="0;450;450;0;0" keyTimes="0;0.55;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <linearGradient id="rk-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e6f5" stop-opacity="0"/>
      <stop offset="1" stop-color="#e9e6f5" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#rk-cardClip)">
    <!-- Base canvas: near-black -->
    <rect width="1200" height="300" fill="url(#rk-base)"/>

    <!-- Faint nebula wisps (barely visible) -->
    <rect width="1200" height="300" fill="url(#rk-neb-tr)"/>
    <rect width="1200" height="300" fill="url(#rk-neb-bl)"/>
    <rect width="1200" height="300" fill="url(#rk-haze)"/>

    <!-- Starfield — small, sparse, mostly white with pale blue -->
    <g fill="#ffffff">
      <circle cx="88" cy="42" r="0.9" opacity="0.7"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.2s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="176" cy="118" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="248" cy="56" r="1" opacity="0.75"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="3.6s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="342" cy="142" r="0.6" opacity="0.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="42" r="0.8" opacity="0.65"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="2.9s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="508" cy="88" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="586" cy="34" r="0.9" opacity="0.7"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="672" cy="126" r="0.6" opacity="0.45"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.5s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="748" cy="48" r="0.8" opacity="0.6"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="856" cy="98" r="0.7" opacity="0.55"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.3s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="962" cy="42" r="0.9" opacity="0.7"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="1088" cy="120" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.6s" begin="1.9s" repeatCount="indefinite"/></circle>

      <!-- Lower half stars -->
      <circle cx="128" cy="222" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="228" cy="268" r="0.8" opacity="0.6"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="368" cy="238" r="0.6" opacity="0.4"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="482" cy="282" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="628" cy="262" r="0.9" opacity="0.65"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.5s" begin="0.2s" repeatCount="indefinite"/></circle>
      <circle cx="742" cy="238" r="0.6" opacity="0.45"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="2.8s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="872" cy="278" r="0.8" opacity="0.55"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.3s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="1002" cy="242" r="0.7" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="1148" cy="262" r="0.8" opacity="0.6"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.4s" begin="1.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- A few faint pale-blue stars (like portfolio's blackbody palette) -->
    <g fill="#c4b5fd">
      <circle cx="308" cy="88" r="0.9" opacity="0.55"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="548" cy="182" r="0.8" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="908" cy="188" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.5s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#a5f3fc">
      <circle cx="188" cy="162" r="0.8" opacity="0.5"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="812" cy="202" r="0.7" opacity="0.45"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="3.3s" begin="0.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Very subtle distant planet on right (barely there — like portfolio's teal planet) -->
    <g transform="translate(1092, 158)" opacity="0.6">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/>
        <circle r="42" fill="none" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="0.8" stroke-dasharray="3 7"/>
      </g>
      <circle r="26" fill="#0f0a1f"/>
      <circle r="26" fill="url(#rk-haze)"/>
      <circle r="26" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="0.8"/>
      <circle cx="-8" cy="-6" r="3" fill="#a78bfa" fill-opacity="0.35"/>
      <circle cx="8" cy="4" r="1.8" fill="#22d3ee" fill-opacity="0.4"/>
      <!-- Tiny orbiting moon -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
        <circle cx="42" cy="0" r="1.8" fill="#22d3ee" opacity="0.7"/>
      </g>
    </g>

    <!-- Slow meteor streak (1 only — portfolio has ~6 max, but 1 keeps it subtle) -->
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" values="980,-10;420,220;420,220" keyTimes="0;0.24;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0;0" keyTimes="0;0.04;0.20;0.28;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="52" y2="-30" stroke="url(#rk-trail)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1.6" fill="#e9e6f5" filter="url(#rk-starGlow)"/>
    </g>

    <!-- Name — portfolio hero h1 .name exact style -->
    <text x="600" y="146" text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="600"
      font-size="72" fill="url(#rk-name)" letter-spacing="-1.5">Ritika Kalia</text>

    <!-- Subtitle — matching portfolio's muted JetBrains Mono label style -->
    <text x="600" y="180" text-anchor="middle"
      font-family="ui-monospace, 'SF Mono', Consolas, monospace"
      font-size="12" fill="#8b82a8" letter-spacing="3">CS UNDERGRAD · AI/ML &amp; FULL-STACK DEVELOPER</text>

    <!-- Terminal bar — portfolio terminal exact: rgba(5,3,12,0.9) + rgba(167,139,250,0.12) border -->
    <g transform="translate(340, 206)">
      <rect width="520" height="40" rx="10" fill="#05030c" fill-opacity="0.9" stroke="#a78bfa" stroke-opacity="0.12" stroke-width="1"/>
      <text x="16" y="26" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14" fill="#22d3ee">&gt;_</text>
      <g clip-path="url(#rk-typeClip)" transform="translate(42,0)">
        <text x="0" y="26" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" fill="#e9e6f5">Building <tspan fill="#a78bfa">intelligent</tspan> solutions for a <tspan fill="#22d3ee">smarter</tspan> tomorrow.</text>
      </g>
      <rect x="42" y="12" width="2" height="16" fill="#22d3ee">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="x" values="42;42;470;470;42;42" keyTimes="0;0.001;0.55;0.85;0.92;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Vignette — exact portfolio overlay -->
    <rect width="1200" height="300" fill="url(#rk-vig)"/>

    <!-- Border — portfolio .project-item border style (thin + subtle glow) -->
    <rect x="0.5" y="0.5" width="1199" height="299" rx="22" fill="none" stroke="url(#rk-border)" stroke-width="1"/>
    <rect x="0.5" y="0.5" width="1199" height="299" rx="22" fill="none" stroke="#a78bfa" stroke-width="4" opacity="0.04" filter="url(#rk-softGlow)">
      <animate attributeName="opacity" values="0.02;0.08;0.02" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
